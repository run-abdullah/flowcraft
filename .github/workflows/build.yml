name: Build FlowCraft Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Add pnpm to PATH
        run: |
          echo "$env:USERPROFILE\AppData\Local\pnpm" >> $env:GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & Build Engine
        working-directory: ./flowcraft
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller
          pyinstaller --onefile binaries/process_pdf.py --distpath binaries/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        working-directory: ./flowcraft
        run: |
          $env:PATH += ";$env:GOPATH\bin"
          wails build -platform windows/amd64 -clean

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: FlowCraft-Windows
          path: flowcraft/build/bin/flowcraft.exe

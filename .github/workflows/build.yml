name: Build Windows App

on:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python & PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies & Build Exe
        shell: pwsh
        run: |
          pip install pymupdf pyinstaller
          pyinstaller --onefile --name process_pdf src-tauri/binaries/process_pdf.py
          if (!(Test-Path -Path "src-tauri/binaries")) { New-Item -ItemType Directory -Path "src-tauri/binaries" }
          Copy-Item "dist/process_pdf.exe" -Destination "src-tauri/binaries/process_pdf-x86_64-pc-windows-msvc.exe" -Force

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: "FlowCraft Windows v1.0.0"
          releaseDraft: false
          prerelease: false
